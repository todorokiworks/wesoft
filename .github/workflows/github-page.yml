name: Deploy to GitHub Pages

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        working-directory: front-end
        run: npm ci

      - name: Build
        working-directory: front-end
        env:
          REACT_APP_BASE_PATH: /wesoft
          REACT_APP_MICROCMS_SERVICE_DOMAIN: ${{ secrets.REACT_APP_MICROCMS_SERVICE_DOMAIN }}
          REACT_APP_MICROCMS_API_KEY: ${{ secrets.REACT_APP_MICROCMS_API_KEY }}
        run: |
          npm run prebuild
          npm run build
          npm run postbuild

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: front-end/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
